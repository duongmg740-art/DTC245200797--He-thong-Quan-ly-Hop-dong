<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Quản lý hợp đồng{% endblock %}</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "Segoe UI", sans-serif; color: #182230; background: #f4f6fa; }
    body { margin: 0; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 1rem 5vw; background: #10243a; color: white; }
    header a { color: white; text-decoration: none; margin-right: 1rem; }
    main { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    .card { background: white; border: 1px solid #e1e7ef; border-radius: 10px; padding: 1.2rem; margin: 1rem 0; }
    .button { display: inline-block; padding: .65rem 1rem; border-radius: 6px; background: #1769aa; color: white; border: 0; text-decoration: none; cursor: pointer; }
    .button.secondary { background: #526579; }
    input, select, textarea { box-sizing: border-box; width: 100%; padding: .65rem; border: 1px solid #bdc8d5; border-radius: 5px; }
    label { display: block; font-weight: 600; margin: .8rem 0 .35rem; }
    input[type=checkbox] { width: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .75rem; border-bottom: 1px solid #e5eaf0; }
    .muted { color: #66778a; } .errorlist { color: #a61b1b; }
    .toolbar { display: flex; gap: .6rem; align-items: end; flex-wrap: wrap; }
    .toolbar > div { min-width: 180px; flex: 1; }
    @media (max-width: 640px) { header { align-items: flex-start; flex-direction: column; } table { font-size: .88rem; } }
  </style>
</head>
<body>
<header>
  <nav><a href="{% url 'contracts:list' %}"><strong>Hợp đồng</strong></a><a href="{% url 'contracts:parties' %}">Bên liên quan</a></nav>
  {% if user.is_authenticated %}
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<span>{{ user.username }}</span> <button class="button secondary" type="submit">Đăng xuất</button></form>
  {% endif %}
</header>
<main>
  {% if messages %}{% for message in messages %}<div class="card">{{ message }}</div>{% endfor %}{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
