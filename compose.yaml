name: dtc245200797-contracts

services:
  log-init:
    image: busybox:1.37
    user: "0:0"
    command: ["sh", "-c", "chown 10001:2000 /logs && chmod 2770 /logs"]
    volumes:
      - contract-logs:/logs
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: "no"

  db:
    image: postgres:17.6-alpine
    user: "70:70"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env and set database credentials}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Set POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set a strong POSTGRES_ADMIN_PASSWORD}
      APP_DB_USER: ${APP_DB_USER:?Set APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set a strong APP_DB_PASSWORD}
      POSTGRES_EXPORTER_USER: ${POSTGRES_EXPORTER_USER:?Set POSTGRES_EXPORTER_USER}
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD:?Set a strong POSTGRES_EXPORTER_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init/10-contract-roles.sql:/docker-entrypoint-initdb.d/10-contract-roles.sql:ro
    networks:
      - data
    depends_on:
      log-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql:uid=70,gid=70,mode=0775
    security_opt:
      - no-new-privileges:true

  web:
    build: .
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set a unique DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${APP_DB_USER:?Set APP_DB_USER}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
      POSTGRES_HOST: db
    command: ["sh", "-c", "python manage.py migrate --noinput && exec gunicorn contract_portal.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile - --error-logfile -"]
    volumes:
      - contract-logs:/var/log/contracts
      - static-files:/staticfiles
    networks:
      - ingress
      - data
    depends_on:
      log-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/metrics', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "80:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static-files:/staticfiles:ro
      - contract-logs:/var/log/contracts
    networks:
      - ingress
    group_add:
      - "2000"
    depends_on:
      log-init:
        condition: service_completed_successfully
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9.8
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set a strong PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_LISTEN_PORT: "5050"
    ports:
      - "127.0.0.1:5050:5050"
    networks:
      data: {}
      management: {}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  static-files:
  contract-logs:

networks:
  ingress:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  data:
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24
  management:
    ipam:
      config:
        - subnet: 172.33.0.0/24
