server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /run/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: django
    static_configs:
      - targets:
          - localhost
        labels:
          job: contract-platform
          service: django
          __path__: /var/log/contracts/app.log

  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: contract-platform
          service: nginx
          __path__: /var/log/contracts/nginx-access.log

  - job_name: postgresql
    static_configs:
      - targets:
          - localhost
        labels:
          job: contract-platform
          service: postgres
          __path__: /var/log/contracts/postgres.log
